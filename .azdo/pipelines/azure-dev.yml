name: App-Deploy-Main-$(Date:yyyyMMdd).$(Rev:r)

trigger:
  - main
  - master

variables:
- group: App-Env-Vars

pool:
  name: "Default"

steps:
- pwsh: |
    azd config set auth.useAzCliAuth "true"
  displayName: Configure AZD to Use AZ CLI Authentication

# --- STEP 1: Provision Infrastructure ---
- task: AzureCLI@2
  displayName: Provision Infrastructure
  inputs:
    azureSubscription: Azure-Service-Connection
    scriptType: ps
    scriptLocation: inlineScript
    useGlobalConfig: true
    inlineScript: |
      $ErrorActionPreference = "Stop"
      $commitCount = git rev-list --count HEAD
      if ($commitCount -gt 1) {
          $changedFiles = git diff --name-only HEAD~1 HEAD infra/
          if ($null -eq $changedFiles -or $changedFiles.Count -eq 0) {
              Write-Host "No infra changes detected. Skipping provision."
          } else {
              azd provision --no-prompt
          }
      } else {
          azd provision --no-prompt
      }
  env:
    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
    AZURE_ENV_NAME: $(AZURE_ENV_NAME)
    AZURE_LOCATION: $(AZURE_LOCATION)

# --- STEP 2: Deploy Application ---
- task: AzureCLI@2
  displayName: Deploy Application
  inputs:
    azureSubscription: Azure-Service-Connection
    scriptType: ps
    scriptLocation: inlineScript
    useGlobalConfig: true
    inlineScript: |
      $ErrorActionPreference = "Stop"
      azd deploy --no-prompt
      $SERVICE_URL = azd env get-value SERVICE_WEB_URI
      $filePath = "$(Build.ArtifactStagingDirectory)/app-url.txt"
      New-Item -Path "$(Build.ArtifactStagingDirectory)" -ItemType Directory -Force
      [System.IO.File]::WriteAllText($filePath, $SERVICE_URL)
      Write-Host "##vso[task.setvariable variable=APP_URL;isOutput=true]$SERVICE_URL"
  env:
    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
    AZURE_ENV_NAME: $(AZURE_ENV_NAME)
    AZURE_LOCATION: $(AZURE_LOCATION)

# --- STEP 3: Publish URL ---
- task: PublishPipelineArtifact@1
  displayName: Publish Deployed App URL
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/app-url.txt'
    artifact: 'DeployedAppInfo'

